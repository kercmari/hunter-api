services:
  postgres:
    image: postgres:16-alpine
    container_name: hunter-apis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-hunter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      POSTGRES_DB: ${DB_NAME:-hunter}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Solo en localhost: la base nunca queda expuesta a la red.
      # Cambiar DB_PORT si el equipo ya tiene un PostgreSQL en ese puerto.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - hunter_apis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hunter} -d ${DB_NAME:-hunter}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB

  api:
    build: .
    container_name: hunter-apis
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro de la red de Compose la base se resuelve por nombre de
      # servicio y por su puerto interno, no por los del host.
      DB_HOST: postgres
      DB_PORT: 5432
      # La base solo es alcanzable por la red interna de Compose y su puerto
      # no se publica fuera de localhost, así que no viaja por una red
      # insegura. En un servidor gestionado, usar DB_SSL=true en su lugar.
      DB_TRUSTED_NETWORK: "true"
    ports:
      # 0.0.0.0 a propósito: ngrok debe poder alcanzar el servicio.
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        # Arranca solo cuando la base acepta conexiones, no antes.
        condition: service_healthy
    # Las migraciones corren en cada arranque: son idempotentes y así un
    # despliegue nuevo nunca queda con el esquema desactualizado.
    command: >
      sh -c "node dist/infrastructure/persistence/migrations/run.js &&
             node dist/main.js"

volumes:
  hunter_apis_data:
    name: hunter_apis_data
